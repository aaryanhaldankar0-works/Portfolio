<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" style="background:#0d0f12; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="archGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="rgba(255, 255, 255, 0.07)"/>
    </pattern>

    <!-- Arrow Markers -->
    <marker id="arrowClay" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97757"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818cf8"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97757"/>
    </marker>

    <!-- Linear Gradients -->
    <linearGradient id="returnGradient" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#d97757" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#d97757" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1600" height="900" fill="#0d0f12"/>
  <rect width="1600" height="900" fill="url(#archGrid)"/>

  <!-- Architectural Frame & Corner Registration Marks -->
  <rect x="30" y="30" width="1540" height="840" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
  <path d="M 22 30 L 38 30 M 30 22 L 30 38" stroke="#d97757" stroke-width="1.5"/>
  <path d="M 1562 30 L 1578 30 M 1570 22 L 1570 38" stroke="#d97757" stroke-width="1.5"/>
  <path d="M 22 870 L 38 870 M 30 862 L 30 878" stroke="#d97757" stroke-width="1.5"/>
  <path d="M 1562 870 L 1578 870 M 1570 862 L 1570 878" stroke="#d97757" stroke-width="1.5"/>

  <!-- Header Datum -->
  <g transform="translate(70, 75)">
    <text x="0" y="0" fill="#d97757" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="0.18em" font-weight="600">03 / FIELD RESEARCH · COMMUTER TOPOLOGY</text>
    <text x="0" y="32" fill="#f8fafc" font-size="26" font-weight="600" letter-spacing="-0.02em">THE BROKEN COMMUTE · MULTI-LEG TRANSFER FRICTION</text>
    <text x="0" y="58" fill="#94a3b8" font-size="14" font-weight="400">Field mapping of commuter transfer points across short, moderate, and long corridors in Tier 2 &amp; Tier 3 India.</text>
    
    <!-- Coordinate Stamp -->
    <text x="1460" y="24" text-anchor="end" fill="rgba(255, 255, 255, 0.25)" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.12em">SCALE: 1:1 FIELD INTERVIEWS · LAT: 18.5204° N</text>
  </g>

  <!-- Divider Line -->
  <line x1="70" y1="160" x2="1530" y2="160" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- =========================================================================
       SECTION 01: LONG DISTANCE (8 – 25 km)
       ========================================================================= -->
  <g transform="translate(70, 195)">
    <!-- Lane Label & Distance Metric -->
    <rect x="0" y="0" width="220" height="26" fill="rgba(217, 119, 87, 0.12)" stroke="rgba(217, 119, 87, 0.3)" stroke-width="1"/>
    <text x="12" y="17" fill="#d97757" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.1em">01 / LONG DISTANCE</text>
    <text x="235" y="17" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">8 – 25 km · 4 TRANSFERS · 65–85 MIN TOTAL</text>

    <!-- Outbound Track -->
    <text x="0" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.08em">OUTBOUND</text>
    
    <!-- Nodes: Home -> Walk -> Auto -> Bus -> Destination -->
    <!-- Node: Home -->
    <g transform="translate(110, 44)">
      <rect x="0" y="0" width="110" height="36" fill="#161920" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#f8fafc"/>
      <text x="32" y="22" fill="#f8fafc" font-size="13" font-weight="500">Home</text>
    </g>

    <!-- Connector: Walk 0.8km -->
    <line x1="220" y1="62" x2="310" y2="62" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
    <text x="265" y="52" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Walk 0.8km</text>

    <!-- Node: Auto / Shared Tracker -->
    <g transform="translate(315, 44)">
      <rect x="0" y="0" width="175" height="36" fill="#1b1e26" stroke="#d97757" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#d97757"/>
      <text x="32" y="22" fill="#f8fafc" font-size="13" font-weight="500">Shared Auto / Feeder</text>
    </g>

    <!-- Friction Callout: Wait 10-15m -->
    <g transform="translate(495, 34)">
      <rect x="0" y="0" width="110" height="20" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
      <text x="8" y="14" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="500">⚠ Wait 10–15m</text>
    </g>

    <!-- Connector: Tracker Corridor -->
    <line x1="490" y1="62" x2="630" y2="62" stroke="#d97757" stroke-width="2" marker-end="url(#arrowClay)"/>
    <text x="560" y="78" text-anchor="middle" fill="#d97757" font-family="'JetBrains Mono', monospace" font-size="10">Corridor Feeder</text>

    <!-- Node: City Bus Junction -->
    <g transform="translate(635, 44)">
      <rect x="0" y="0" width="150" height="36" fill="#181b28" stroke="#818cf8" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#818cf8"/>
      <text x="32" y="22" fill="#f8fafc" font-size="13" font-weight="500">Arterial Bus Leg</text>
    </g>

    <!-- Friction Callout: High Transfer Crowd -->
    <g transform="translate(790, 34)">
      <rect x="0" y="0" width="115" height="20" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
      <text x="8" y="14" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="500">⚠ Irregular Cadence</text>
    </g>

    <!-- Connector: Bus to Destination -->
    <line x1="785" y1="62" x2="930" y2="62" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowIndigo)"/>
    <text x="858" y="78" text-anchor="middle" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="10">Arterial Trunk</text>

    <!-- Node: Destination -->
    <g transform="translate(935, 44)">
      <rect x="0" y="0" width="145" height="36" fill="#161920" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#22c55e"/>
      <text x="32" y="22" fill="#f8fafc" font-size="13" font-weight="600">Destination</text>
    </g>

    <!-- Turn-around Loop Indicator -->
    <path d="M 1080 62 C 1120 62, 1120 128, 1080 128" fill="none" stroke="#d97757" stroke-width="2.5" stroke-dasharray="6 3"/>
    <polygon points="1080,123 1070,128 1080,133" fill="#d97757"/>

    <!-- Inbound Track -->
    <text x="0" y="132" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.08em">INBOUND</text>

    <!-- Inbound Nodes Reversed -->
    <!-- Return Destination start -->
    <g transform="translate(935, 110)">
      <rect x="0" y="0" width="135" height="36" fill="#161920" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="18" y="22" fill="#cbd5e1" font-size="12">Depart Work</text>
    </g>

    <line x1="935" y1="128" x2="795" y2="128" stroke="#818cf8" stroke-width="1.8" marker-end="url(#arrowIndigo)"/>
    <text x="865" y="144" text-anchor="middle" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="10">Overcrowded Bus</text>

    <g transform="translate(635, 110)">
      <rect x="0" y="0" width="150" height="36" fill="#181b28" stroke="#818cf8" stroke-width="1"/>
      <text x="20" y="22" fill="#cbd5e1" font-size="12">Junction Transfer</text>
    </g>

    <line x1="635" y1="128" x2="495" y2="128" stroke="#d97757" stroke-width="1.8" marker-end="url(#arrowClay)"/>
    <text x="565" y="144" text-anchor="middle" fill="#d97757" font-family="'JetBrains Mono', monospace" font-size="10">Shared Auto Return</text>

    <g transform="translate(315, 110)">
      <rect x="0" y="0" width="175" height="36" fill="#1b1e26" stroke="#d97757" stroke-width="1"/>
      <text x="20" y="22" fill="#cbd5e1" font-size="12">Village Drop Point</text>
    </g>

    <line x1="315" y1="128" x2="225" y2="128" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
    <text x="270" y="144" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Unlit Walk</text>

    <g transform="translate(110, 110)">
      <rect x="0" y="0" width="110" height="36" fill="#161920" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1"/>
      <text x="32" y="22" fill="#f8fafc" font-size="13" font-weight="500">Home</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="70" y1="390" x2="1530" y2="390" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

  <!-- =========================================================================
       SECTION 02: MODERATE DISTANCE (3 – 8 km)
       ========================================================================= -->
  <g transform="translate(70, 420)">
    <!-- Lane Label & Distance Metric -->
    <rect x="0" y="0" width="220" height="26" fill="rgba(226, 157, 98, 0.1)" stroke="rgba(226, 157, 98, 0.25)" stroke-width="1"/>
    <text x="12" y="17" fill="#e29d62" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.1em">02 / MODERATE DISTANCE</text>
    <text x="235" y="17" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">3 – 8 km · 2 TRANSFERS · 30–45 MIN TOTAL</text>

    <!-- Outbound Track -->
    <text x="0" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.08em">OUTBOUND</text>

    <!-- Node: Home -->
    <g transform="translate(110, 44)">
      <rect x="0" y="0" width="110" height="36" fill="#161920" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#f8fafc"/>
      <text x="32" y="22" fill="#f8fafc" font-size="13" font-weight="500">Home</text>
    </g>

    <line x1="220" y1="62" x2="330" y2="62" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
    <text x="275" y="52" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Walk 0.4km</text>

    <!-- Node: Shared Auto Stand -->
    <g transform="translate(335, 44)">
      <rect x="0" y="0" width="190" height="36" fill="#1b1e26" stroke="#d97757" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#d97757"/>
      <text x="32" y="22" fill="#f8fafc" font-size="13" font-weight="500">Informal Auto Stand</text>
    </g>

    <!-- Friction Callout: Driver waiting for full capacity -->
    <g transform="translate(535, 34)">
      <rect x="0" y="0" width="155" height="20" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
      <text x="8" y="14" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="500">⚠ Wait for 6–8 Passengers</text>
    </g>

    <line x1="525" y1="62" x2="720" y2="62" stroke="#d97757" stroke-width="2" marker-end="url(#arrowClay)"/>
    <text x="622" y="78" text-anchor="middle" fill="#d97757" font-family="'JetBrains Mono', monospace" font-size="10">Point-to-Point Intermediate Transit</text>

    <!-- Node: Destination -->
    <g transform="translate(725, 44)">
      <rect x="0" y="0" width="160" height="36" fill="#161920" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#22c55e"/>
      <text x="32" y="22" fill="#f8fafc" font-size="13" font-weight="600">College / Market</text>
    </g>

    <!-- Turn-around Loop Indicator -->
    <path d="M 885 62 C 925 62, 925 128, 885 128" fill="none" stroke="#d97757" stroke-width="2.5" stroke-dasharray="6 3"/>
    <polygon points="885,123 875,128 885,133" fill="#d97757"/>

    <!-- Inbound Track -->
    <text x="0" y="132" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.08em">INBOUND</text>

    <g transform="translate(725, 110)">
      <rect x="0" y="0" width="150" height="36" fill="#161920" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="18" y="22" fill="#cbd5e1" font-size="12">Depart Market</text>
    </g>

    <line x1="725" y1="128" x2="535" y2="128" stroke="#d97757" stroke-width="1.8" marker-end="url(#arrowClay)"/>
    <text x="630" y="144" text-anchor="middle" fill="#d97757" font-family="'JetBrains Mono', monospace" font-size="10">Evening Peak Auto Surge</text>

    <g transform="translate(335, 110)">
      <rect x="0" y="0" width="190" height="36" fill="#1b1e26" stroke="#d97757" stroke-width="1"/>
      <text x="20" y="22" fill="#cbd5e1" font-size="12">Neighborhood Drop Point</text>
    </g>

    <line x1="335" y1="128" x2="225" y2="128" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
    <text x="280" y="144" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Final Walk</text>

    <g transform="translate(110, 110)">
      <rect x="0" y="0" width="110" height="36" fill="#161920" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1"/>
      <text x="32" y="22" fill="#f8fafc" font-size="13" font-weight="500">Home</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="70" y1="610" x2="1530" y2="610" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

  <!-- =========================================================================
       SECTION 03: SHORT DISTANCE (1 – 3 km)
       ========================================================================= -->
  <g transform="translate(70, 640)">
    <!-- Lane Label & Distance Metric -->
    <rect x="0" y="0" width="220" height="26" fill="rgba(148, 163, 184, 0.1)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1"/>
    <text x="12" y="17" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="0.1em">03 / SHORT DISTANCE</text>
    <text x="235" y="17" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">1 – 3 km · 0 TRANSFERS · 15–25 MIN WALKING</text>

    <!-- Outbound Track -->
    <text x="0" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.08em">OUTBOUND</text>

    <!-- Node: Home -->
    <g transform="translate(110, 44)">
      <rect x="0" y="0" width="110" height="36" fill="#161920" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#f8fafc"/>
      <text x="32" y="22" fill="#f8fafc" font-size="13" font-weight="500">Home</text>
    </g>

    <!-- Friction Callout: No Footpath, Extreme Dust -->
    <g transform="translate(235, 34)">
      <rect x="0" y="0" width="180" height="20" fill="rgba(239, 68, 68, 0.15)" stroke="rgba(239, 68, 68, 0.4)" stroke-width="1"/>
      <text x="8" y="14" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="500">⚠ Footpath Absence &amp; Dust</text>
    </g>

    <line x1="220" y1="62" x2="445" y2="62" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
    <text x="332" y="78" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Exposed Pedestrian Walkway</text>

    <!-- Node: Local Destination -->
    <g transform="translate(450, 44)">
      <rect x="0" y="0" width="155" height="36" fill="#161920" stroke="rgba(255, 255, 255, 0.35)" stroke-width="1"/>
      <circle cx="18" cy="18" r="4" fill="#22c55e"/>
      <text x="32" y="22" fill="#f8fafc" font-size="13" font-weight="600">Local Junction</text>
    </g>

    <!-- Turn-around Loop Indicator -->
    <path d="M 605 62 C 645 62, 645 128, 605 128" fill="none" stroke="#d97757" stroke-width="2.5" stroke-dasharray="6 3"/>
    <polygon points="605,123 595,128 605,133" fill="#d97757"/>

    <!-- Inbound Track -->
    <text x="0" y="132" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.08em">INBOUND</text>

    <g transform="translate(450, 110)">
      <rect x="0" y="0" width="155" height="36" fill="#161920" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
      <text x="18" y="22" fill="#cbd5e1" font-size="12">Return Leg</text>
    </g>

    <line x1="450" y1="128" x2="225" y2="128" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>
    <text x="337" y="144" text-anchor="middle" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">Walk in Darkness / Heat</text>

    <g transform="translate(110, 110)">
      <rect x="0" y="0" width="110" height="36" fill="#161920" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1"/>
      <text x="32" y="22" fill="#f8fafc" font-size="13" font-weight="500">Home</text>
    </g>
  </g>

  <!-- Bottom Architectural Legend & Synthesis Datum -->
  <g transform="translate(70, 835)">
    <rect x="0" y="0" width="1460" height="34" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1"/>
    
    <circle cx="20" cy="17" r="4" fill="#94a3b8"/>
    <text x="32" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">Pedestrian Walk Leg</text>

    <circle cx="200" cy="17" r="4" fill="#d97757"/>
    <text x="212" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">Shared Feeder (Tracker / Auto)</text>

    <circle cx="430" cy="17" r="4" fill="#818cf8"/>
    <text x="442" y="21" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10.5">Arterial City Bus</text>

    <rect x="610" y="9" width="16" height="16" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1"/>
    <text x="635" y="21" fill="#fca5a5" font-family="'JetBrains Mono', monospace" font-size="10.5">Transfer Bottleneck (Avg 10–15 min waiting friction)</text>

    <text x="1440" y="21" text-anchor="end" fill="#d97757" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600">CORE INSIGHT: SOLVE THE TRANSFER, NOT JUST THE VEHICLE</text>
  </g>
</svg>
